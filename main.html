<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰子物理引擎</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#09111f}
body{font-family:var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);touch-action:none}
#app{position:fixed;inset:0;font-family:var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);user-select:none;overflow:hidden;background:
radial-gradient(circle at 50% 20%,rgba(67,101,173,.28),transparent 38%),
linear-gradient(180deg,#0e1730 0%,#0a1224 48%,#08111d 100%)}
#controls{position:absolute;top:max(18px,calc(env(safe-area-inset-top) + 10px));left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:0;border:1px solid rgba(255,255,255,.12);border-radius:999px;overflow:hidden;background:rgba(10,14,24,.7);backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.cb{background:none;border:none;width:44px;height:44px;font-size:20px;cursor:pointer;color:var(--color-text-primary,#eef2ff);transition:background .1s;display:flex;align-items:center;justify-content:center}
.cb:hover{background:var(--color-background-secondary,rgba(255,255,255,.08))}
.cb:disabled{color:var(--color-text-tertiary,rgba(238,242,255,.35));cursor:default}
#cdis{min-width:72px;text-align:center;font-size:14px;font-weight:500;color:var(--color-text-primary,#eef2ff);border-left:0.5px solid var(--color-border-tertiary,rgba(255,255,255,.1));border-right:0.5px solid var(--color-border-tertiary,rgba(255,255,255,.1));height:44px;display:flex;align-items:center;justify-content:center}
#cw{position:absolute;inset:0;overflow:hidden;cursor:pointer;touch-action:manipulation}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));transform:translateX(-50%);font-size:13px;color:rgba(231,236,247,.72);padding:.45rem .8rem;border-radius:999px;background:rgba(8,12,22,.55);backdrop-filter:blur(14px);z-index:3}
</style>
</head>
<body>
<div id="app">
  <h2 class="sr-only">物理引擎骰子擲出動畫</h2>
  <div id="controls">
    <button class="cb" id="bm">−</button>
    <div id="cdis">1 顆</div>
    <button class="cb" id="bp">+</button>
  </div>
  <div id="cw"><canvas id="c"></canvas></div>
  <div id="hint">點擊擲骰</div>
</div>
<script src="./dice_physics_engine.js"></script>
</body>
</html>
